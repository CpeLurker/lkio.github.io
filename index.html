<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人联系名片</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="card-container">
        <div class="business-card">
            <div class="header">
                <div class="avatar">
                    <img src="avatar.jpg" alt="头像">
                </div>
                <h1>您的姓名</h1>
                <h2>职位 / 身份</h2>
            </div>
            
            <div class="contact-info">
                <h3>联系方式</h3>
                <ul>
                    <li>
                        <i class="fas fa-envelope"></i>
                        <span>邮箱：your.email@example.com</span>
                    </li>
                    <li>
                        <i class="fas fa-phone"></i>
                        <span>电话：+86 138-xxxx-xxxx</span>
                    </li>
                    <li>
                        <i class="fas fa-map-marker-alt"></i>
                        <span>地点：您的城市/地区</span>
                    </li>
                </ul>
            </div>

            <div class="social-links">
                <a href="https://github.com/您的用户名" target="_blank" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
                <a href="https://www.linkedin.com/in/您的用户名" target="_blank" title="LinkedIn">
                    <i class="fab fa-linkedin"></i>
                </a>
                <a href="https://weibo.com/您的ID" target="_blank" title="微博">
                    <i class="fab fa-weibo"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
